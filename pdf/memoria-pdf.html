<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memoria de Supervisión de Enfermería 2026 · Urgencias Antequera</title>
  <!-- Tipografías incluidas en local para que el PDF se genere igual sin conexión -->
  <link href="../assets/fonts/fonts-embebidas.css" rel="stylesheet">
  <style>
    :root { --suh: #1e5b9c; --suh-700: #164879; --suh-900: #0c2a4a; --suh-950: #061527; --suh-400: #4f8fd1; --suh-200: #a9cdf3; --suh-100: #e7f0fa; --suh-50: #f3f8fd;
      --junta: #007a33; --junta-50: #e8f5ed; --snm: #e07b24; --snm-50: #fdf1e6; --red: #c62828; --red-50: #fdecec; --gold: #c99a2e;
      --ink: #0f1d2e; --ink-2: #33475b; --ink-3: #5c6f82; --line: #dce5ee; }
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: var(--ink); background: #8a97a6; font-size: 9.6pt; line-height: 1.5; }
    .serif { font-family: 'Fraunces', Georgia, serif; font-weight: 800; letter-spacing: -.015em; }
    svg.i { width: 1.1em; height: 1.1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    img { display: block; max-width: 100%; }

    .page { width: 210mm; height: 297mm; margin: 10mm auto; background: #fff; position: relative; overflow: hidden; padding: 24mm 17mm 20mm; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
    @media print { body { background: #fff; } .page { margin: 0; box-shadow: none; page-break-after: always; break-after: page; } }

    /* Cabecera y pie */
    .ph { position: absolute; top: 8mm; left: 17mm; right: 17mm; display: flex; justify-content: space-between; align-items: center; padding-bottom: 3mm; border-bottom: 1px solid var(--line); }
    .ph .lg { display: flex; align-items: center; gap: 3mm; }
    .ph .lg img { object-fit: contain; }
    .ph span { font-size: 7.5pt; color: var(--ink-3); font-weight: 600; letter-spacing: .02em; }
    .pf { position: absolute; bottom: 8mm; left: 17mm; right: 17mm; display: flex; justify-content: space-between; font-size: 7.5pt; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 2.5mm; }
    .pf b { color: var(--suh); }

    /* Títulos */
    .kick { font-size: 8pt; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--suh); display: flex; align-items: center; gap: 3mm; }
    .kick::before { content: ""; width: 10mm; height: 2px; background: var(--suh); }
    h1.t { font-size: 25pt; line-height: 1.08; margin: 2.5mm 0 4mm; }
    h1.t em { font-style: italic; color: var(--suh); }
    h2.s { font-size: 12pt; font-weight: 800; margin: 5mm 0 2mm; color: var(--suh-900); display: flex; align-items: center; gap: 2mm; }
    h2.s svg { color: var(--suh); }
    p { color: var(--ink-2); margin-bottom: 2.4mm; text-align: justify; hyphens: auto; }
    .lead { font-size: 11pt; line-height: 1.55; color: var(--ink-2); }
    ul.l { list-style: none; display: flex; flex-direction: column; gap: 1.6mm; margin: 1mm 0 3mm; }
    ul.l li { display: flex; gap: 2.4mm; color: var(--ink-2); }
    ul.l li svg { color: var(--junta); margin-top: .6mm; }
    .tag { display: inline-block; font-size: 7pt; font-weight: 800; padding: .6mm 1.8mm; border-radius: 1.4mm; background: var(--junta-50); color: var(--junta); white-space: nowrap; }
    .box { border: 1px solid var(--line); border-radius: 3mm; padding: 4mm 4.5mm; background: #fafcfe; }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; }
    .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3.5mm; }
    .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3mm; }
    table.t { width: 100%; border-collapse: collapse; font-size: 8.2pt; }
    table.t th { text-align: left; font-size: 6.8pt; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--suh-900); padding: 2mm 2.4mm; }
    table.t th:first-child { border-top-left-radius: 2mm; } table.t th:last-child { border-top-right-radius: 2mm; }
    table.t td { padding: 1.8mm 2.4mm; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink-2); }
    table.t tr:nth-child(even) td { background: #f7fafd; }
    table.t td b { color: var(--ink); }
    .grow { flex: 1; }

    /* Portada */
    .cover { padding: 0; color: #fff; background: var(--suh-950); }
    .cover .bg { position: absolute; inset: 0; }
    .cover .bg img { width: 100%; height: 100%; object-fit: cover; }
    .cover .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,21,39,.35) 0%, rgba(6,21,39,.55) 40%, rgba(6,21,39,.97) 78%), linear-gradient(90deg, rgba(6,21,39,.6), transparent 70%); }
    .cover .in { position: relative; z-index: 1; height: 100%; padding: 16mm 17mm 18mm; display: flex; flex-direction: column; }
    .cover .logos { display: inline-flex; align-items: center; gap: 5mm; background: #fff; padding: 3mm 5mm; border-radius: 3.5mm; align-self: flex-start; }
    .cover .logos img { object-fit: contain; }
    .cover .acsa { display: inline-flex; align-items: center; gap: 2.5mm; align-self: flex-start; padding: 1.4mm 3.5mm 1.4mm 1.4mm; border-radius: 99px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); font-size: 9pt; font-weight: 700; }
    .cover .acsa b { background: #fff; color: var(--junta); padding: .8mm 3mm; border-radius: 99px; font-size: 8pt; letter-spacing: .06em; }
    .cover h1 { font-size: 40pt; line-height: 1.02; margin: 6mm 0 4mm; }
    .cover h1 em { font-style: italic; color: var(--suh-200); }
    .cover .sub { font-size: 13pt; color: rgba(255,255,255,.85); }
    .cover .who { display: flex; align-items: center; gap: 4mm; margin-top: 10mm; padding-top: 6mm; border-top: 1px solid rgba(255,255,255,.25); }
    .avatar { width: 15mm; height: 15mm; border-radius: 50%; background: linear-gradient(135deg, var(--suh-400), var(--suh-900)); border: 2px solid rgba(255,255,255,.7); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13pt; color: #fff; flex-shrink: 0; }
    .cover .who b { font-size: 14pt; display: block; } .cover .who span { font-size: 9.5pt; color: rgba(255,255,255,.8); }
    .cover .trib { margin-top: 6mm; font-size: 9pt; letter-spacing: .14em; text-transform: uppercase; color: var(--suh-200); font-weight: 800; }

    /* Índice */
    .toc { display: flex; flex-direction: column; }
    .toc div { display: grid; grid-template-columns: 12mm 1fr 10mm; align-items: baseline; padding: 2.2mm 0; border-bottom: 1px dashed var(--line); font-size: 10.5pt; }
    .toc div span:first-child { font: 800 11pt 'Fraunces', serif; color: var(--suh); }
    .toc div span:last-child { text-align: right; font-weight: 700; color: var(--ink-3); }
    .ficha { display: grid; grid-template-columns: 34mm 1fr; gap: 1.6mm 4mm; font-size: 9pt; }
    .ficha dt { color: var(--ink-3); font-weight: 700; } .ficha dd { color: var(--ink); font-weight: 600; }

    /* Cifras */
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3mm; }
    .kpi { border-radius: 3mm; padding: 4mm; background: var(--suh-900); color: #fff; }
    .kpi b { display: block; font: 800 22pt 'Fraunces', serif; line-height: 1; }
    .kpi span { font-size: 7.8pt; color: rgba(255,255,255,.8); font-weight: 600; }
    .claves { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; }
    .clave { display: flex; gap: 3mm; padding: 3.5mm; border-radius: 3mm; border: 1px solid var(--line); border-left: 1.2mm solid var(--c, var(--suh)); }
    .clave .ic { width: 9mm; height: 9mm; border-radius: 2.4mm; background: var(--c, var(--suh)); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .clave b { display: block; font-size: 9.5pt; margin-bottom: .6mm; }
    .clave p { font-size: 8.3pt; margin: 0; text-align: left; }

    /* Carta */
    .quote { position: relative; padding: 6mm 7mm; border-radius: 4mm; background: linear-gradient(135deg, var(--suh-50), #fff); border: 1px solid var(--line); }
    .quote p { font-size: 10pt; line-height: 1.62; }
    .sign { display: flex; align-items: center; gap: 3mm; margin-top: 4mm; }
    .sign b { display: block; font-size: 10.5pt; } .sign span { font-size: 8pt; color: var(--ink-3); }
    .mvv > div { padding: 4mm; border-radius: 3mm; background: var(--suh-50); border: 1px solid var(--line); }
    .mvv b { display: flex; gap: 2mm; align-items: center; color: var(--suh); font-size: 10pt; margin-bottom: 1.5mm; }
    .mvv p { font-size: 8.5pt; margin: 0; text-align: left; }
    .vals { display: flex; flex-wrap: wrap; gap: 1.5mm; }
    .vals span { font-size: 7.6pt; font-weight: 700; padding: .8mm 2.4mm; border-radius: 99px; background: var(--suh-100); color: var(--suh); }

    /* Fotos */
    .areas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3.5mm; }
    .area { border-radius: 3mm; overflow: hidden; border: 1px solid var(--line); background: #fff; }
    .area .ph2 { height: 36mm; position: relative; }
    .area .ph2 img { width: 100%; height: 100%; object-fit: cover; }
    .area .ph2 span { position: absolute; right: 2mm; top: 2mm; font-size: 6.8pt; font-weight: 800; background: rgba(6,21,39,.75); color: #fff; padding: .6mm 2mm; border-radius: 1.5mm; }
    .area div.tx { padding: 2.5mm 3mm 3mm; }
    .area b { font-size: 9pt; display: block; } .area p { font-size: 7.6pt; margin: .6mm 0 0; text-align: left; line-height: 1.4; }

    /* Triaje */
    .set { display: flex; flex-direction: column; gap: 2.2mm; }
    .set-row { display: grid; grid-template-columns: 58mm 1fr 18mm; gap: 3mm; align-items: center; font-size: 8.6pt; }
    .set-row b { font-weight: 800; } .set-row small { display: block; font-size: 7.2pt; color: var(--ink-3); font-weight: 600; }
    .bar { height: 4.5mm; background: #eef3f8; border-radius: 99px; overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: 99px; }
    .set-row > span { text-align: right; font-weight: 800; }
    .circs { display: flex; flex-wrap: wrap; gap: 1.6mm; }
    .circs span { font-size: 7.8pt; font-weight: 700; padding: 1mm 2.6mm; border-radius: 1.6mm; border: 1px solid var(--line); background: #f7fafd; }
    .tl { display: flex; align-items: center; margin: 3mm 0; }
    .tl .pt { width: 22mm; text-align: center; font-size: 7.5pt; font-weight: 800; flex-shrink: 0; }
    .tl .pt i { display: block; width: 4mm; height: 4mm; border-radius: 50%; background: var(--suh-900); margin: 0 auto 1mm; }
    .tl .sg { flex: 1; height: 11mm; border-radius: 2.5mm; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; margin-bottom: 4mm; }
    .tl .sg b { font-size: 10pt; letter-spacing: .1em; } .tl .sg small { font-size: 7pt; opacity: .95; }

    /* Flujo */
    .flow { display: grid; grid-template-columns: 1fr 5mm 1fr 5mm 1fr 5mm 1fr; align-items: stretch; }
    .flow .st { border-radius: 3mm; padding: 3.5mm; background: var(--suh-50); border: 1px solid var(--line); }
    .flow .st.hi { background: var(--junta-50); border-color: rgba(0,122,51,.35); }
    .flow .st b { display: block; font: 800 15pt 'Fraunces', serif; color: var(--c, var(--suh)); line-height: 1; }
    .flow .st h4 { font-size: 9pt; margin: 1.5mm 0 1mm; } .flow .st p { font-size: 7.6pt; margin: 0; text-align: left; line-height: 1.4; }
    .flow .ar { display: flex; align-items: center; justify-content: center; color: var(--suh-400); font-weight: 800; }

    /* ACSA */
    .seal { display: flex; gap: 6mm; align-items: center; padding: 6mm; border-radius: 4mm; color: #fff; background: linear-gradient(135deg, #04381b, var(--junta)); }
    .medal { width: 30mm; height: 30mm; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: conic-gradient(#fff6c9, #e9c55a, #fff6c9, #c99a2e, #fff6c9); }
    .medal > div { width: 24mm; height: 24mm; border-radius: 50%; background: #04381b; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .medal b { font-size: 7pt; letter-spacing: .2em; } .medal span { font: 800 11pt 'Fraunces', serif; color: #f5d36b; }
    .seal h3 { font-size: 17pt; line-height: 1.1; } .seal p { color: rgba(255,255,255,.88); margin: 2mm 0 0; font-size: 9pt; }
    .lv { display: grid; grid-template-columns: 24mm 1fr 1fr 1fr; gap: 3mm; align-items: center; padding: 2.6mm 3mm; border-radius: 2.5mm; border: 1px solid var(--line); font-size: 8pt; }
    .lv.cur { border-color: var(--junta); background: var(--junta-50); }
    .lv h5 { font-size: 10pt; } .lv h5 small { font-size: 6.5pt; background: var(--junta); color: #fff; padding: .4mm 1.4mm; border-radius: 1mm; margin-left: 1mm; vertical-align: 1px; }
    .lv div span { font-size: 7pt; color: var(--ink-3); font-weight: 700; }
    .lv i { display: block; height: 2.4mm; border-radius: 99px; background: #e9eef4; margin-top: .8mm; overflow: hidden; }
    .lv i u { display: block; height: 100%; border-radius: 99px; text-decoration: none; }
    .g-ob { color: var(--red); font-weight: 800; }

    /* DAFO */
    .dafo { display: grid; grid-template-columns: 1fr 1fr; gap: 3.5mm; }
    .dq { border-radius: 3.5mm; padding: 4mm 4.5mm; border: 1px solid var(--line); border-top: 1.4mm solid var(--c); background: #fff; position: relative; overflow: hidden; }
    .dq::after { content: attr(data-l); position: absolute; right: 3mm; top: -3mm; font: 800 34mm/1 'Fraunces', serif; color: var(--c); opacity: .07; }
    .dq h4 { font-size: 12pt; color: var(--c); margin-bottom: 2mm; }
    .dq ul { list-style: none; display: flex; flex-direction: column; gap: 1.8mm; position: relative; }
    .dq li { font-size: 8pt; color: var(--ink-2); line-height: 1.42; padding-left: 3mm; position: relative; }
    .dq li::before { content: ""; position: absolute; left: 0; top: 1.6mm; width: 1.4mm; height: 1.4mm; border-radius: 50%; background: var(--c); }
    .dq li b { color: var(--ink); }
    .dq li .pr { font-size: 6.4pt; font-weight: 800; background: var(--c); color: #fff; padding: .3mm 1.4mm; border-radius: 1mm; margin-left: 1mm; }
    .came { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3mm; }
    .came > div { padding: 3.5mm; border-radius: 3mm; border: 1px solid var(--line); border-top: 1.2mm solid var(--c); }
    .came small { font-size: 6.8pt; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
    .came b { display: block; font-size: 9pt; margin: 1mm 0; } .came p { font-size: 7.6pt; margin: 0; text-align: left; line-height: 1.4; }

    /* Plan */
    .objs { display: grid; grid-template-columns: 1fr 1fr; gap: 3.5mm; }
    .obj { padding: 4mm; border-radius: 3mm; border: 1px solid var(--line); background: #fafcfe; }
    .obj.hi { background: var(--snm-50); border-color: rgba(224,123,36,.4); }
    .obj h4 { display: flex; gap: 2.5mm; align-items: center; font-size: 10pt; margin-bottom: 2mm; }
    .obj h4 span { width: 7mm; height: 7mm; border-radius: 2mm; background: var(--suh); color: #fff; font: 800 10pt 'Fraunces', serif; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .obj.hi h4 span { background: var(--snm); }
    .obj ul { list-style: none; font-size: 8pt; color: var(--ink-2); display: flex; flex-direction: column; gap: 1mm; margin-bottom: 2mm; }
    .obj li::before { content: "→ "; color: var(--suh); font-weight: 800; }

    /* Capturas */
    .shot { border-radius: 3mm; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 3mm 8mm -4mm rgba(12,42,74,.35); }
    .shot img { width: 100%; }
    .cap { font-size: 7.4pt; color: var(--ink-3); margin-top: 1.4mm; font-weight: 600; }
    .web-map { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.5mm; }
    .web-map div { padding: 3mm; border-radius: 2.5mm; background: var(--suh-50); border: 1px solid var(--line); }
    .web-map b { display: flex; gap: 1.6mm; align-items: center; font-size: 8.6pt; color: var(--suh-900); }
    .web-map b svg { color: var(--suh); }
    .web-map p { font-size: 7.3pt; margin: 1mm 0 0; text-align: left; line-height: 1.38; }
    .guion { font-size: 7.6pt; }
    .guion td:first-child { font-weight: 800; color: var(--suh); width: 8mm; }
    .guion td:nth-child(3) { white-space: nowrap; text-align: right; font-weight: 700; }

    /* Página final */
    .final { background: linear-gradient(160deg, var(--suh-900), var(--suh-950)); color: #fff; padding: 0; }
    .final .in { position: relative; z-index: 1; height: 100%; padding: 18mm 17mm; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .final::before { content: ""; position: absolute; right: -40mm; top: -40mm; width: 140mm; height: 140mm; border-radius: 50%; border: 22mm solid rgba(255,255,255,.04); }
    .final .logos { display: inline-flex; align-items: center; gap: 5mm; background: #fff; padding: 3mm 5mm; border-radius: 3.5mm; }
    .final .logos img { object-fit: contain; }
    .final h2 { font-size: 26pt; margin: 9mm 0 2mm; line-height: 1.1; }
    .final h2 em { font-style: italic; color: var(--suh-200); }
    .final .sub { font-size: 10.5pt; color: rgba(255,255,255,.82); max-width: 150mm; }
    .qr-main { margin-top: 9mm; background: #fff; border-radius: 5mm; padding: 6mm; box-shadow: 0 6mm 20mm -6mm rgba(0,0,0,.6); }
    .qr-main .qr svg { width: 62mm; height: 62mm; display: block; }
    .qr-main b { display: block; color: var(--suh-900); font-size: 10.5pt; margin-top: 3mm; }
    .qr-main code { display: block; color: var(--suh); font: 700 8.6pt ui-monospace, Consolas, monospace; margin-top: 1mm; word-break: break-all; max-width: 62mm; }
    .qr-row { display: flex; gap: 6mm; margin-top: 8mm; justify-content: center; }
    .qr-sm { background: #fff; border-radius: 3.5mm; padding: 3.5mm; width: 46mm; }
    .qr-sm .qr svg { width: 39mm; height: 39mm; display: block; }
    .qr-sm b { display: block; color: var(--suh-900); font-size: 8.6pt; margin-top: 2mm; }
    .qr-sm span { display: block; color: var(--ink-3); font-size: 7pt; }
    .final .foot { margin-top: auto; font-size: 8.5pt; color: rgba(255,255,255,.75); }
    .final .foot b { color: #fff; font-size: 11pt; display: block; margin-bottom: 1mm; }
  </style>
</head>
<body>
<main id="doc"></main>

<script src="../assets/icons.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/qrcode.min.js"></script>
<script>
  /* ================================================================
     CONFIGURACIÓN DEL CÓDIGO QR
     Cuando el portal esté publicado, escribe aquí su dirección
     (o pásala como ?web=https://... al generar el PDF).
     ================================================================ */
  const WEB_URL = new URLSearchParams(location.search).get('web') || '';

  const D = window.SUH, I = window.svgIcon;
  const IMG = '../img/', CAP = 'capturas/';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const qr = (url, ec) => { const q = qrcode(0, ec || 'M'); q.addData(url); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); };

  const header = () => `<div class="ph"><div class="lg"><img src="${IMG}logo-suh.jpg" style="height:9mm" alt=""><img src="${IMG}logo-snm.jpg" style="height:4.4mm" alt=""><img src="${IMG}logo-junta.jpg" style="height:8mm" alt=""></div><span>Memoria de Supervisión de Enfermería 2026 · Servicio de Urgencias · Hospital de Antequera</span></div>`;
  const footer = () => `<div class="pf"><span>Manuel Isaías Medina Pérez · Supervisor de Enfermería</span><span>Página <b class="pn"></b></span></div>`;
  const page = (html, cls) => `<section class="page ${cls || ''}">${cls && /cover|final/.test(cls) ? '' : header()}${html}${cls && /cover|final/.test(cls) ? '' : footer()}</section>`;
  const head = (kick, title) => `<div class="kick">${kick}</div><h1 class="t serif">${title}</h1>`;
  const li = arr => `<ul class="l">${arr.map(x => `<li>${I('check')}<span>${x}</span></li>`).join('')}</ul>`;

  const pages = [];

  /* 1 · PORTADA */
  pages.push(page(`
    <div class="bg"><img src="${IMG}fotos/full/entrada-urgencias-01.jpg" alt=""></div>
    <div class="in">
      <div class="logos"><img src="${IMG}logo-suh.jpg" style="height:17mm" alt="SUH"><img src="${IMG}logo-snm.jpg" style="height:8mm" alt="Salud Norte Málaga"><img src="${IMG}logo-junta.jpg" style="height:15mm" alt="Junta de Andalucía"></div>
      <div class="grow"></div>
      <span class="acsa"><b>ACSA</b> Unidad certificada · Nivel Óptimo</span>
      <h1 class="serif">Memoria de Supervisión de Enfermería <em>2026</em></h1>

        <div><span>Grupo I · ${l.g1}</span><i><u style="width:${w(l.g1)}%; background:var(--junta)"></u></i></div>
        <div><span>Grupo II · ${l.g2}</span><i><u style="width:${w(l.g2)}%; background:var(--suh)"></u></i></div>
        <div><span>Grupo III · ${l.g3}</span><i><u style="width:${w(l.g3)}%; background:var(--snm)"></u></i></div></div>`; }).join('')}
    </div>
    <div class="grow"></div>
    <div class="shot"><img src="${CAP}pres-acsa.jpg" alt=""></div><div class="cap">Diapositiva de la presentación: certificación ACSA nivel Óptimo.</div>`));

  /* 11 · MAPA ACSA */
  const rows = []; D.ACSA.forEach(b => b.criterios.forEach(c => c.est.forEach(e => rows.push({ c: c.c.split(' · ')[0], e }))));
  const acsaTable = list => `<table class="t" style="font-size:7.8pt;"><thead><tr><th style="width:25mm">Código</th><th style="width:17mm">Grupo</th><th>Estándar (resumen)</th><th>Evidencia del servicio</th></tr></thead><tbody>
      ${list.map(r => `<tr><td><b style="font-family:Consolas,monospace; color:var(--suh)">${r.e[0]}</b><br><span style="font-size:6.6pt; color:var(--ink-3)">${r.c}</span></td><td class="${r.e[1].includes('oblig') ? 'g-ob' : ''}">${r.e[1]}</td><td><b>${r.e[2]}</b></td><td>${r.e[3]}</td></tr>`).join('')}
    </tbody></table>`;
  const cut = rows.findIndex(r => r.c.startsWith('Criterio 4'));
  pages.push(page(`
    ${head('09 · Mapa de evidencias', 'Estándares clave <em>y evidencias del servicio</em>')}
    <p>Selección de estándares del Manual ME 5 1_08 especialmente relacionados con la supervisión de enfermería, con la evidencia que aporta el servicio. Los estándares obligatorios se señalan en rojo. <b>Criterios 1 a 3.</b></p>
    ${acsaTable(rows.slice(0, cut))}`));
  pages.push(page(`
    ${head('09 · Mapa de evidencias (continuación)', 'Calidad científico-técnica <em>y seguridad</em>')}
    <p><b>Criterios 4 a 6.</b> Calidad científico-técnica, seguridad del paciente y soporte.</p>
    ${acsaTable(rows.slice(cut))}
    <div class="grow"></div>
    <div class="box"><p style="margin:0; text-align:left;"><b>Hacia el nivel Excelente:</b> requiere el 100 % de los grupos I y II y más del 40 % del grupo III. Estándares del grupo III a abordar: comparación de resultados con otras unidades (ES 5 01.09_03), satisfacción de clientes internos (ES 5 01.17_00), experiencia del paciente en la mejora de procesos (ES 5 02.05_00) e investigación financiada (ES 5 04.08_02).</p></div>`));

  /* 12 · DAFO */
  const dq = (k, c) => { const q = D.DAFO[k]; return `<div class="dq" data-l="${k}" style="--c:${c}"><h4>${q.titulo}</h4><ul>${q.items.map(it => `<li><b>${it.t}</b>${it.mejora ? '<span class="pr">PRIORIDAD</span>' : ''}<br>${it.d}</li>`).join('')}</ul></div>`; };
  pages.push(page(`
    ${head('10 · Análisis estratégico', 'Análisis DAFO · <em>interno</em>')}
    <p>Fortalezas y debilidades del servicio. Como fortalezas destacan las reuniones de gobernanza tras la auditoría de prevención de riesgos laborales, y las auditorías de dolor y del registro de continuidad de cuidados; como área de mejora prioritaria, la TECLA y la TICLA.</p>
    <div class="dafo" style="flex:1">${dq('F', '#007a33')}${dq('D', '#c62828')}</div>`));
  pages.push(page(`
    ${head('10 · Análisis estratégico (continuación)', 'Análisis DAFO · <em>externo</em>')}
    <p>Oportunidades y amenazas del entorno sanitario del Área Norte de Málaga.</p>
    <div class="dafo" style="flex:1">${dq('O', '#1e5b9c')}${dq('A', '#e07b24')}</div>
    <div class="shot" style="margin-top:4mm;"><img src="${CAP}pres-dafo.jpg" alt=""></div><div class="cap">Síntesis del DAFO en la presentación del proyecto.</div>`));

  /* 13 · CAME + INDICADORES */
  const fuentes = { i1: 'Auditoría de historias', i2: 'Auditoría de registros', i3: 'web_e-PAT', i4: 'web_e-PAT', i5: 'web_e-PAT / Diraya', i6: 'web_e-PAT / Diraya', i7: 'Actas de gobernanza', i8: 'Registro de acogida', i9: 'Sistema de notificación', i10: 'Encuesta de clima' };
  pages.push(page(`
    ${head('11 · Estrategias e indicadores', 'De la estrategia <em>a la medida</em>')}
    <h2 class="s" style="margin-top:0">${I('compass')} Estrategias CAME</h2>
    <div class="came">${D.CAME.map(c => `<div style="--c:${c.color}"><small>${c.tipo} · ${c.clave}</small><b>${c.t}</b><p>${c.d}</p></div>`).join('')}</div>
    <h2 class="s">${I('chart')} Cuadro de indicadores</h2>
    <p>Indicadores de seguimiento del proyecto. Las metas son propuestas de la supervisión; los resultados se registran en el portal a partir de las fuentes indicadas.</p>
    <table class="t"><thead><tr><th>Indicador</th><th>Fórmula</th><th>Meta</th><th>Fuente</th><th>Estándar</th></tr></thead><tbody>
      ${D.INDICADORES.map(i => `<tr><td><b>${i.t}</b></td><td>${i.f}</td><td style="white-space:nowrap; font-weight:800; color:var(--suh)">${i.meta}</td><td>${fuentes[i.id] || ''}</td><td><span class="tag">${i.acsa}</span></td></tr>`).join('')}
    </tbody></table>`));

  /* 14 · PLAN 2027 */
  pages.push(page(`
    ${head('12 · Plan de acción 2027', 'Seis compromisos <em>para 2027</em>')}
    <p class="lead">El plan traduce el DAFO en acciones concretas, con responsable en la supervisión, seguimiento en las reuniones de gobernanza y vinculación a los estándares ACSA.</p>
    <div class="objs" style="margin-top:4mm;">${D.OBJETIVOS.map((o, i) => `<div class="obj ${i === 0 ? 'hi' : ''}"><h4><span>${o.n}</span>${o.t}</h4><ul>${o.acc.map(a => `<li>${a}</li>`).join('')}</ul><span class="tag">${o.acsa}</span></div>`).join('')}</div>
    <div class="grow"></div>
    <div class="shot"><img src="${CAP}pres-tecla.jpg" alt=""></div><div class="cap">Diapositiva de la presentación: TECLA y TICLA, área de mejora prioritaria.</div>`));

  /* 15 · HERRAMIENTAS */
  const toolTable = list => `<table class="t" style="font-size:7.9pt;"><thead><tr><th style="width:38mm">Herramienta</th><th style="width:30mm">Área</th><th style="width:34mm">Versión / referencia</th><th>Contenido</th></tr></thead><tbody>
      ${list.map(t => `<tr><td><b>${t.t}</b></td><td style="color:${D.CATS[t.cat].color}; font-weight:700">${D.CATS[t.cat].label}</td><td>${t.v}</td><td>${t.d}</td></tr>`).join('')}
    </tbody></table>`;
  pages.push(page(`
    ${head('13 · Transformación digital', 'Ecosistema digital <em>del servicio</em>')}
    <p>El servicio dispone de 20 herramientas interactivas propias que funcionan en cualquier navegador, sin instalación ni servidor y sin guardar datos de pacientes. Todas comparten una barra de acceso al portal y a las redes sociales del servicio.</p>
    ${toolTable(D.TOOLS.slice(0, 10))}`));
  pages.push(page(`
    ${head('13 · Transformación digital (continuación)', 'Protocolos, cuidados <em>y archivo</em>')}
    ${toolTable(D.TOOLS.slice(10))}
    <div class="grow"></div>
    <div class="box"><p style="margin:0; text-align:left;"><b>Gobierno de las herramientas (2027):</b> responsable y fecha de revisión por herramienta, validación clínica antes del uso asistencial, retirada de versiones anteriores y corrección de las incoherencias documentales detectadas (ES 5 01.05_00).</p></div>`));

  /* 16 · EL PORTAL WEB */
  const MAP = [['home', 'Inicio', 'Portada con cifras clave, sello ACSA y acceso a la presentación.'], ['book', 'Memoria', 'Los 14 capítulos de esta memoria, imprimibles, con indicadores editables.'], ['award', 'ACSA', 'Niveles de certificación y mapa interactivo de estándares y evidencias.'], ['grid', 'DAFO', 'DAFO interactivo y editable con detalle, estándar y herramienta.'], ['layers', 'Herramientas', 'Las 20 webs con buscador, filtros y vista previa.'], ['camera', 'Instalaciones', 'Galería de 72 fotografías de 9 áreas, ampliables.'], ['instagram', 'Redes', 'Instagram @suh_antequera_, Facebook y X del área sanitaria.'], ['presentation', 'Presentación', '22 diapositivas, 15 minutos, notas del ponente y demos en directo.']];
  pages.push(page(`
    ${head('14 · El portal web', 'Toda la memoria, <em>en una web</em>')}
    <p>El proyecto se acompaña de un portal web que reúne la memoria, la presentación, el análisis estratégico, la acreditación, las herramientas y las imágenes del servicio, con la identidad visual del SUH y enlaces a sus redes sociales.</p>
    <div class="shot"><img src="${CAP}portal-inicio.jpg" alt=""></div><div class="cap">Portada del portal web del proyecto.</div>
    <h2 class="s">${I('compass')} Secciones del portal</h2>
    <div class="web-map">${MAP.map(m => `<div><b>${I(m[0])} ${m[1]}</b><p>${m[2]}</p></div>`).join('')}</div>
    <div class="grow"></div>
    <div class="g2"><div><div class="shot"><img src="${CAP}pres-servicio.jpg" alt=""></div><div class="cap">Presentación · El servicio en imágenes.</div></div><div><div class="shot"><img src="${CAP}pres-dafo.jpg" alt=""></div><div class="cap">Presentación · Análisis DAFO.</div></div></div>`));

  /* 17 · GUION DE LA PRESENTACIÓN */
  const GUION = [['Portada', 30], ['Agenda', 25], ['El servicio en imágenes', 40], ['Misión, visión y valores', 35], ['Triaje SET y circuitos', 45], ['Sala de Críticos', 35], ['Modelo de supervisión en seis pilares', 40], ['Acogida y formación', 40], ['De la auditoría de PRL al clima laboral', 50], ['Gestión por procesos', 50], ['Códigos tiempo-dependientes', 40], ['Demo en directo: Triaje', 50], ['Seguridad del paciente', 35], ['Auditorías de dolor + demo en directo', 50], ['Continuidad de cuidados', 45], ['Fragilidad, heridas y contención', 35], ['Demo en directo: Recomendaciones de Salud', 40], ['ACSA nivel Óptimo', 50], ['Análisis DAFO', 55], ['TECLA y TICLA', 45], ['Plan 2027', 45], ['Gracias', 20]];
  let acc = 0; const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  pages.push(page(`
    ${head('15 · Exposición ante el tribunal', 'Guion de la presentación · <em>15 minutos</em>')}
    <div class="g2" style="grid-template-columns: 1.15fr 1fr; align-items:start;">
      <table class="t guion"><thead><tr><th>#</th><th>Diapositiva</th><th>Fin</th></tr></thead><tbody>
        ${GUION.map((g, i) => { acc += g[1]; return `<tr><td>${i + 1}</td><td>${g[0]}</td><td>${fmt(acc)}</td></tr>`; }).join('')}
      </tbody></table>
      <div>
        <div class="shot"><img src="${CAP}pres-portada.jpg" alt=""></div><div class="cap">Portada de la presentación.</div>
        <h2 class="s">${I('keyboard')} Cómo se presenta</h2>
        ${li(['Se abre desde el portal o con el archivo <b>presentacion.html</b>.', '<b>F</b> pantalla completa · <b>→</b> avanzar · <b>N</b> notas del ponente.', '<b>A</b> modo automático: avanza solo según el tiempo previsto (15:00).', 'Cronómetro con aviso si la exposición va con retraso.', 'Tres demostraciones en directo de las herramientas del servicio.'])}
        <div class="box" style="margin-top:2mm;"><p style="margin:0; text-align:left;"><b>Mensaje final para el tribunal:</b> calidad acreditada, un equipo cuidado y escuchado, cuidados medidos y un plan claro para reducir la TECLA y la TICLA en 2027.</p></div>
      </div>
    </div>`));

  /* 18 · PÁGINA FINAL CON QR */
  const IG = D.PROYECTO.redes.instagram, FB = D.PROYECTO.redes.facebook;
  const main = WEB_URL
    ? { url: WEB_URL, t: 'Portal web del proyecto', s: 'Memoria, presentación, DAFO, ACSA y herramientas' }
    : { url: IG, t: 'Instagram del servicio · @suh_antequera_', s: '' };
  const small = WEB_URL ? [[IG, 'Instagram', '@suh_antequera_'], [FB, 'Facebook', 'SUH Antequera']] : [[FB, 'Facebook', 'SUH Antequera'], [D.PROYECTO.redes.x, 'X · Área Sanitaria', '@saludnortemalag']];
  pages.push(page(`
    <div class="in">
      <div class="logos"><img src="${IMG}logo-suh.jpg" style="height:15mm" alt=""><img src="${IMG}logo-snm.jpg" style="height:7mm" alt=""><img src="${IMG}logo-junta.jpg" style="height:13mm" alt=""></div>
      <h2 class="serif">Escanea y accede <em>al proyecto</em></h2>
      <p class="sub">${WEB_URL ? 'El portal web reúne la memoria completa, la presentación de 15 minutos, el DAFO interactivo, el mapa ACSA, las 20 herramientas y las fotografías del servicio.' : 'El portal web del proyecto —memoria, presentación, DAFO, ACSA, herramientas y fotografías— se muestra en directo durante la exposición. Sigue al servicio en sus redes sociales.'}</p>
      <div class="qr-main"><div class="qr">${qr(main.url, 'Q')}</div><b>${main.t}</b><code>${esc(main.url.replace(/^https?:\/\//, ''))}</code></div>
      <div class="qr-row">${small.map(s => `<div class="qr-sm"><div class="qr">${qr(s[0])}</div><b>${s[1]}</b><span>${s[2]}</span></div>`).join('')}</div>
      <div class="foot"><b>Manuel Isaías Medina Pérez</b>Supervisor de Enfermería · Servicio de Urgencias · Hospital de Antequera<br>Área de Gestión Sanitaria Norte de Málaga · Octubre 2026</div>
    </div>`, 'final'));

  document.getElementById('doc').innerHTML = pages.join('');
  // Fuerza la carga de todas las variantes tipográficas antes de imprimir
  ['400', '600', '700', '800'].forEach(w => document.fonts.load(`${w} 12px "Plus Jakarta Sans"`));
  ['800', 'italic 600'].forEach(w => document.fonts.load(`${w} 12px "Fraunces"`));
  const allPages = [...document.querySelectorAll('.page')];
  allPages.forEach((p, i) => { const n = p.querySelector('.pn'); if (n) n.textContent = i + 1; });
  // Números de página del índice: primera página cuya sección empieza por ese número
  document.querySelectorAll('[data-toc]').forEach(el => {
    const code = el.dataset.toc;
    const i = code === '16' ? allPages.length - 1 : allPages.findIndex(p => (p.querySelector('.kick')?.textContent || '').startsWith(code + ' '));
    el.textContent = i >= 0 ? i + 1 : '';
  });

  /* Aviso en consola si alguna página desborda */
  window.addEventListener('load', () => {
    document.querySelectorAll('.page').forEach((p, i) => { if (p.scrollHeight > p.clientHeight + 2) console.warn('Desborde en la página ' + (i + 1) + ': ' + (p.scrollHeight - p.clientHeight) + ' px'); });
  });
</script>
</body>
</html>
